name: Refresh Activity Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync roster from Google Sheets
        env:
          STUDENT_SHEET_CSV_URL: ${{ secrets.STUDENT_SHEET_CSV_URL }}
        run: npm run sync:roster

      - name: Crawl activity snapshots
        run: npm run crawl:data

      - name: Validate data
        run: npm run validate:data

      - name: Build site
        run: npm run build

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/students src/data/students src/data/student-summaries.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): refresh CP stats [automated]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
